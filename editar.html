<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pessoas – Editar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Gestão de Pessoas</h1>
    <nav>
      <a href="index.html">Listagem</a>
      <a href="cadastro.html">Cadastrar</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Editar pessoa</h2>
      <form id="form-editar" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100">

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" max="130">

        <button type="submit" class="botao" id="btn-salvar">Salvar alterações</button>
        <a href="index.html" class="botao secundario">Voltar</a>
      </form>
      <div id="mensagem" role="status"></div>
    </section>
  </main>
  <script src="js/editar.js"></script>
</body>
</html>
