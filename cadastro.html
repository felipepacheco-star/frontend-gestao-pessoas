<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pessoas – Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Gestão de Pessoas</h1>
    <nav>
      <a href="index.html">Listagem</a>
      <a href="cadastro.html" class="ativo">Cadastrar</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Cadastrar pessoa</h2>
      <form id="form-cadastro" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100" placeholder="Ex.: Ana Souza">

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" max="130" placeholder="Ex.: 28">

        <button type="submit" class="botao" id="btn-salvar">Cadastrar</button>
        <a href="index.html" class="botao secundario">Ver listagem</a>
      </form>
      <div id="mensagem" role="status"></div>
    </section>
  </main>
  <script src="js/cadastro.js"></script>
</body>
</html>
