  <title>Gestão de Pessoas – Listagem</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>

          <tr><td colspan="4" class="vazio">Carregando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="js/listar.js"></script>
